<aside class="sidebar" aria-label="Mission controls">
  <div class="sidebar-scroll">
    <section class="ctrl-section">
      <h2 class="ctrl-title"><span class="ctrl-step">0</span> Landing site</h2>
      <label class="field">
        <span class="field-label">Site</span>
        <div class="select-wrap">
          <select [value]="s.site().entry.id" (change)="s.selectSite(val($event))">
            @for (d of s.sites(); track d.entry.id) { <option [value]="d.entry.id" [selected]="d.entry.id === s.site().entry.id">{{ d.entry.name }}</option> }
          </select>
        </div>
      </label>
      <p class="site-desc">{{ s.site().entry.description }}</p>
      <p class="caption">Aim point is a prototype choice, not an official mission target.</p>
    </section>

    <section class="ctrl-section">
      <h2 class="ctrl-title"><span class="ctrl-step">1</span> Mission window</h2>
      <label class="field">
        <span class="field-label">Landing time (UTC)</span>
        <input type="datetime-local" step="600" class="input" [value]="s.startInput()" (change)="s.setStart(val($event))">
      </label>
      <label class="field">
        <span class="field-label">Duration <output class="field-value">{{ s.durDays() }}</output> days</span>
        <input type="range" min="1" max="30" step="1" class="range" [value]="s.durDays()" (change)="s.setDur(num($event))">
      </label>
      <p class="caption" [class.bad]="s.windowMsg().bad">{{ s.windowMsg().text }}</p>
    </section>

    <section class="ctrl-section">
      <h2 class="ctrl-title"><span class="ctrl-step">2</span> Mission profile</h2>
      <div class="field-grid">
        @for (f of fields; track f.key) {
          <label class="field">
            <span class="field-label">{{ f.label }}</span>
            <input type="number" min="0" [attr.max]="f.max ?? null" [step]="f.step" class="input input--sm" [value]="profileValue(f.key)" (change)="setField(f.key, $event)">
          </label>
        }
      </div>
      <label class="checkbox">
        <input type="checkbox" [checked]="s.profile().conservative" (change)="s.setProfile({ conservative: checked($event) })">
        <span>Treat weakly constrained terrain as rejected</span>
      </label>
    </section>

    <section class="ctrl-section">
      <h2 class="ctrl-title"><span class="ctrl-step">3</span> Landing accuracy</h2>
      <label class="field">
        <span class="field-label">Drift radius <output class="field-value">{{ s.drift() }}</output> m</span>
        <input type="range" min="0" max="500" step="10" class="range" [value]="s.drift()" (change)="s.setDrift(num($event))">
      </label>
      <input type="number" min="0" max="500" step="10" class="input input--sm" aria-label="Drift radius in meters" [value]="s.drift()" (change)="s.setDrift(num($event))">
      <div class="presets">
        @for (v of [100, 250, 400]; track v) { <button class="btn btn--preset" (click)="s.setDrift(v)">{{ v }} m</button> }
      </div>
    </section>

  </div>
</aside>
