<header class="topbar">
  <a routerLink="/" class="brand" aria-label="SHOTSPOT home">
    <svg class="brand-icon" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="2" fill="currentColor"/>
      <line x1="16" y1="0" x2="16" y2="6" stroke="currentColor" stroke-width="1.5"/>
      <line x1="16" y1="26" x2="16" y2="32" stroke="currentColor" stroke-width="1.5"/>
      <line x1="0" y1="16" x2="6" y2="16" stroke="currentColor" stroke-width="1.5"/>
      <line x1="26" y1="16" x2="32" y2="16" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-text">SHOTSPOT</span>
  </a>
  <div class="topbar-actions">
    <button class="btn btn--ghost" [attr.aria-pressed]="s.simple()" (click)="s.toggleSimple()" title="Switch between plain labels and technical details">
      <span class="btn-label">{{ s.simple() ? 'Technical view' : 'Simple view' }}</span>
    </button>
    <button class="btn btn--ghost" (click)="s.exportJson()" [disabled]="!s.ready()" title="Download this scenario as JSON (with assumptions and metadata)"><span class="btn-label">JSON</span></button>
    <button class="btn btn--ghost" (click)="print()" [disabled]="!s.ready()" title="Print or save as PDF"><span class="btn-label">PDF</span></button>
  </div>

  <nav class="topbar-nav" aria-label="Primary">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Home</a>
    <a routerLink="/planner" routerLinkActive="active" class="nav-link">Planner</a>
    <a routerLink="/about" routerLinkActive="active" class="nav-link">Sources &amp; Limits</a>
  </nav>
</header>

<router-outlet />
